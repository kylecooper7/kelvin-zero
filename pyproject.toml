[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvinzero"
version = "0.2.4"
description = "Eclipse-minimising sun-synchronous orbits in a mean-Sun rotating frame: the model and the visualizer behind the Kelvin Zero paper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyle Cooper" }, { name = "Yanni Nikas" }]
keywords = ["sun-synchronous orbit", "eclipse", "analemma", "astrodynamics", "J2", "beta angle"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "contourpy>=1.1"]
hifi = ["scipy>=1.10", "jplephem>=2.20"]
dev = ["pytest>=7", "matplotlib>=3.7", "contourpy>=1.1", "scipy>=1.10", "jplephem>=2.20"]

[project.urls]
Homepage = "https://colure.space/kelvinzero/"
Paper = "https://colure.space/kelvinzero/Kelvin-Zero-Whitepaper.pdf"
Source = "https://github.com/kylecooper7/kelvin-zero"
Issues = "https://github.com/kylecooper7/kelvin-zero/issues"

[project.scripts]
kelvinzero = "kelvinzero.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kelvinzero = ["viewer_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
