[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvinzero"
version = "0.1.0"
description = "Eclipse-minimising sun-synchronous orbits in a mean-Sun rotating frame: the model behind the Kelvin Zero paper and visualizer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyle Cooper" }, { name = "Yanni Nikas" }]
keywords = ["sun-synchronous orbit", "eclipse", "analemma", "astrodynamics", "J2", "beta angle"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "contourpy>=1.1"]
viz = ["plotly>=5.18"]
dev = ["pytest>=7", "matplotlib>=3.7", "contourpy>=1.1", "plotly>=5.18"]

[project.urls]
Homepage = "https://k0webapp.web.app/"
Paper = "https://k0webapp.web.app/Kelvin-Zero-Whitepaper.pdf"

[project.scripts]
kelvinzero = "kelvinzero.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
